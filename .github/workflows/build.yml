name: Build images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      kyserai_ref:
        description: "kyserai git ref to build from (tag, branch or SHA)"
        required: false
        default: "v10.25.5"

permissions:
  contents: read

env:
  KYSERAI_REF: v10.25.5

jobs:
  build:
    name: kyserai ${{ matrix.variant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [nvidia, amd, intel]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Resolve kyserai ref
        id: ref
        run: |
          ref="${{ inputs.kyserai_ref || env.KYSERAI_REF }}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-contexts: |
            kyserai=https://github.com/${{ github.repository_owner }}/kyserai.git#${{ steps.ref.outputs.ref }}
          build-args: |
            GPU_VARIANT=${{ matrix.variant }}
          push: false
          load: true
          tags: |
            kyserai:${{ steps.ref.outputs.ref }}-${{ matrix.variant }}
            kyserai:${{ matrix.variant }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
